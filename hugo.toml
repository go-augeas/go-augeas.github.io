baseURL = "https://go-augeas.github.io/"
title = "go-augeas"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Configuration tree"
  status = "ready"
  blurb = "An ordered tree of labelled nodes with values, built by `New()`; every entry addressable by path, with `Root`, `Label` and node insertion/removal preserving order."
[[params.phases]]
  name = "Path language"
  status = "ready"
  blurb = "Absolute and relative paths, `*` name wildcard, `//` descendant axis, `.` / `..`, positional `[n]` / `[last()]`, value `[sub = 'v']`, regexp `[sub =~ 're']` (RE2), existence predicates, union `|`, and `$var` bindings."
[[params.phases]]
  name = "Editing API"
  status = "ready"
  blurb = "`Get` / `Exists` / `Set` / `SetMultiple` / `Insert` / `Remove` / `Move` / `Match` / `Label` / `DefineVariable` / `DefineNode` — the full tree-mutation surface over path expressions."
[[params.phases]]
  name = "Embedded `.aug` corpus interpreter"
  status = "ready"
  blurb = "A from-scratch pure-Go interpreter reads the entire upstream Augeas 1.14.1 lens corpus (232 modules) plus 5 original contrib lenses (Wireguard, Rclone, Caddyfile, Nftables, Unbound), reachable via `NewEngine().Lens(module, binding)`; `Load` / `Save` run through an injectable `FileSystem` seam. Verified 1791/1791 (100%) against the corpus's own get+put test assertions."
[[params.phases]]
  name = "Public put for interpreted lenses"
  status = "planned"
  blurb = "The interpreter's put (`Build`) is verified correct internally, but the public `Engine.Lens(...)` adapter only wires up `Parse` (get) today; `TextRetrieve`/`Save` don't yet work on corpus/contrib lenses this way. Byte-offset `Span` tracking is a further follow-on."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 9.93:1, bright on the dark background 3.07:1.
  base = "#3730a3"
  deep = "#221d63"
  bright = "#4f46e5"
  shadow = "rgba(55,48,163,.7)"
  glow = "rgba(55,48,163,.6)"
  wash = "rgba(55,48,163,.10)"
  washDeep = "rgba(34,29,99,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#221d63"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"
